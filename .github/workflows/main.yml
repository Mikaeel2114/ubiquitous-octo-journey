# .github/workflows/build.yml
name: Build BedFight Plugin

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JAR (Java 17 / Spigot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Apply source fixups (fixer.py)
        run: python3 fixer.py

      - name: Remove decompiler artifacts
        run: |
          set -e
          find . -type f -name '*$*.java'           -not -path './.git/*' -delete || true
          find . -type f -name 'ee.py'              -not -path './.git/*' -delete || true
          find . -type f -name 'folder_structure*'  -not -path './.git/*' -delete || true
          echo "::group::Java files after cleanup"
          find . -name '*.java' -not -path './.git/*' || true
          echo "::endgroup::"

      - name: Generate pom.xml (only if missing)
        run: |
          if [ -f pom.xml ]; then
            echo "pom.xml already present - using it as-is."
            exit 0
          fi
          cat > pom.xml <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>BedFight</artifactId>
            <version>1.0.0</version>
            <packaging>jar</packaging>
            <name>BedFight</name>
            <description>BedFight minigame plugin</description>
            <properties>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              <java.version>17</java.version>
            </properties>
            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
              <repository>
                <id>codemc</id>
                <url>https://repo.codemc.io/repository/maven-public/</url>
              </repository>
              <repository>
                <id>spigot-repo</id>
                <url>https://hub.spigotmc.org/nexus/content/repositories/snapshots/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>org.spigotmc</groupId>
                <artifactId>spigot-api</artifactId>
                <version>1.8.8-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
            <build>
              <finalName>${project.name}-${project.version}</finalName>
              <sourceDirectory>${project.basedir}</sourceDirectory>
              <resources>
                <resource>
                  <directory>${project.basedir}</directory>
                  <includes>
                    <include>plugin.yml</include>
                    <include>config.yml</include>
                    <include>scoreboard.yml</include>
                  </includes>
                  <filtering>false</filtering>
                </resource>
              </resources>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration>
                    <source>${java.version}</source>
                    <target>${java.version}</target>
                    <encoding>UTF-8</encoding>
                  </configuration>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-jar-plugin</artifactId>
                  <version>3.4.1</version>
                  <configuration>
                    <archive>
                      <manifestEntries>
                        <Built-By>GitHub-Actions</Built-By>
                      </manifestEntries>
                    </archive>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          POM

      - name: Build with Maven
        run: mvn -B -U --no-transfer-progress clean package

      - name: Show build output
        run: |
          echo "::group::target/"
          ls -la target/
          echo "::endgroup::"
          echo "::group::JAR contents"
          jar tf target/*.jar | head -50 || true
          echo "::endgroup::"

      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedFight-plugin
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Attach JAR to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          generate_release_notes: true
